<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <!-- Broad, uneven mottling, like pulp density in real paper -->
  <filter id="mottle" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.25  0 0 0 0.9 -0.35"/>
  </filter>
  <!-- Short fibres -->
  <filter id="fibres" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.35" numOctaves="2" seed="9" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 1.6 -0.9"/>
  </filter>
  <!-- Fine grain -->
  <filter id="grain" x="0" y="0">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 1.4 -0.2"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity="0.5"/>
  <rect width="100%" height="100%" filter="url(#fibres)" opacity="0.35"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.6"/>
</svg>
